kind: Deployment
apiVersion: apps/v1

metadata:
  name: mysql-deployment
  namespace: bankapp
  labels:
    app: mysql

spec:
  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      name: mysql-pod
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql-container
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankapp-sec
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_ROOT_USER
              valueFrom:
                configMapKeyRef:
                  name: bankapp-cm
                  key: MYSQL_ROOT_USER
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: bankapp-cm
                  key: MYSQL_DATABASE

          volumeMounts:
            - mountPath: "/var/lib/mysql"
              name: mysql-data

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: bankapp-pvc
