name: 02 Code scan and quality check

on:
  workflow_call:
    
jobs:
  code-scan:
    runs-on: ubuntu-latest 

    strategy:
      fail-fast: true
      matrix:
        language: ["java"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Codeql init
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build code
        run: mvn clean package -DskipTests

      - name: Code analysis (SAST)
        uses: github/codeql-action/analyze@v4


      - name: Dependency check (SCA)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: 1
          severity: CRITICAL
      
      - name: debug
        run: |
          ls 
          echo "***********************"
          ls target/*
        
