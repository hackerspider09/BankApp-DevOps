name: 04 Deploy to ec2

on:
  workflow_call:
    
  workflow_dispatch:

env:  
  IMAGE_TAG: ${{github.sha}}
  IMAGE_NAME: "${{vars.DOCKERHUB_USERNAME}}/bankapp"

jobs:
  
  check-dependency:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: SSH and check docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            whoami

            if docker --version >/dev/null 2>&1; then
              echo "Docker is present"
            else
              echo "Docker is not installed"
              sudo apt update
              sudo apt install docker.io -y 
              sudo usermod -aG docker $USER
              sudo newgrp docker
            fi

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: check-dependency
    environment: prod

    steps:
      - name: debug
        run: | 
          ls
          pwd
          
      - name: copy compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: "docker-compose.yaml"
          target: "/home/ubuntu"

      - name: ssh and deploy 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export IMAGE_NAME=${{env.IMAGE_NAME}}
            export IMAGE_TAG=${{env.IMAGE_TAG}}
            if (docker info | grep Username | awk -F ': ' '{print $2 }' == ${{secrets.DOCKERHUB_USERNAME}}); then
            work on this
            cd $HOME

            docker compose down || true
            
            docker compose up -d --pull always
            